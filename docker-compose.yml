name: contrail

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [contrail]

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contrail}
      POSTGRES_USER: ${POSTGRES_USER:-contrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contrail}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contrail} -d ${POSTGRES_DB:-contrail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [contrail]

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [contrail]

  api:
    build:
      context: .
      target: base
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
    ports:
      - "8000:8000"
    depends_on:
      redpanda: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [contrail]


  # The pipeline as real long-running services, so a single `docker compose up`
  # produces a live system with a populated dashboard rather than an empty one.
  windowing:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    command: python -m src.windowing.service
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: timescaledb
    depends_on:
      redpanda: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [contrail]

  pipeline:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    # The adaptive supervisor: sink workers plus the lag controller.
    #
    # Run under a shell, with trailing commands so the shell cannot exec-replace
    # itself with python. That keeps python a *child* rather than PID 1, which
    # matters for the Phase 2.5 chaos test: the kernel makes PID 1 in a namespace
    # immune to signals from inside it, and `docker kill` from outside is treated
    # as an operator stop so the restart policy is skipped. With python as a child,
    # killing it is a genuine application crash -- the shell exits non-zero and
    # the restart policy does what it exists to do.
    command: sh -c "python -m src.control.supervisor --max-rate 250 --max-workers 4; echo 'supervisor exited'; exit 1"
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: timescaledb
    depends_on:
      redpanda: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
    networks: [contrail]

  generator:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    # SOURCE=opensky switches this to the live ADS-B feed with no code change.
    command: python -m src.ingestor.run
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      SOURCE: ${SOURCE:-synthetic}
      GEN_AIRCRAFT: ${GEN_AIRCRAFT:-40}
      GEN_RATE_HZ: ${GEN_RATE_HZ:-2}
      CHAOS_OUT_OF_ORDER_PROB: ${CHAOS_OUT_OF_ORDER_PROB:-0.15}
      CHAOS_MAX_SKEW_S: ${CHAOS_MAX_SKEW_S:-20}
      CHAOS_DUPLICATE_PROB: ${CHAOS_DUPLICATE_PROB:-0.03}
      CHAOS_LATE_PROB: ${CHAOS_LATE_PROB:-0.01}
      CHAOS_DROP_PROB: ${CHAOS_DROP_PROB:-0.01}
    depends_on:
      redpanda: {condition: service_healthy}
    networks: [contrail]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [contrail]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [contrail]

  # `docker compose run --rm tests` -- not started by `docker compose up`.
  tests:
    build:
      context: .
      target: dev
    profiles: [dev]
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./load:/app/load
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
    networks: [contrail]

volumes:
  timescale-data:

networks:
  contrail:
