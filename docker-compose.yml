name: contrail

# Local-development stack. Every published port except the API's is bound to
# BIND_HOST, which defaults to loopback: databases, the broker and the dashboards
# are not reachable from the network unless you set BIND_HOST=0.0.0.0 on purpose.
#
# Images are pinned to exact version tags, not digests; .github/dependabot.yml
# proposes bumps as reviewable PRs, and that is the update policy.
#
# Data: the only persistent volume is `timescale-data` (flight_events and the
# dead-letter table). Redis, Redpanda, Prometheus and Grafana state is ephemeral.
#   docker compose down        keeps timescale-data
#   docker compose down -v     DELETES it

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "${BIND_HOST:-127.0.0.1}:9092:9092"
      - "${BIND_HOST:-127.0.0.1}:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [contrail]

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contrail}
      POSTGRES_USER: ${POSTGRES_USER:-contrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contrail}
    # Flushes and checkpoints on SIGTERM; killing it early forces crash recovery.
    stop_grace_period: 60s
    ports:
      # Host side is configurable: a local PostgreSQL commonly already owns 5432.
      - "${BIND_HOST:-127.0.0.1}:${TIMESCALE_HOST_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contrail} -d ${POSTGRES_DB:-contrail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [contrail]

  redis:
    image: redis:7.4-alpine
    ports:
      - "${BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [contrail]

  api:
    build:
      context: .
      target: base
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
    # The application port; bind it to loopback too with API_BIND_HOST=127.0.0.1.
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:8000:8000"
    depends_on:
      redpanda: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [contrail]


  # The pipeline as real long-running services, so a single `docker compose up`
  # produces a live system with a populated dashboard rather than an empty one.
  windowing:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    # Same shell wrapper as `pipeline`: keeps python a child rather than PID 1, so
    # a crash can actually be simulated and the restart policy applies. Without it
    # this service cannot be chaos-tested at all.
    #
    # `trap` forwards SIGTERM to python (sh as PID 1 would otherwise die without
    # telling it), so `docker compose stop` lets the service publish what it has and
    # commit offsets; `wait` twice because the first returns when the trap fires.
    stop_grace_period: 30s
    command:
      - sh
      - -c
      - |
        python -m src.windowing.service & pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        wait $$pid; wait $$pid
        echo 'windowing exited'; exit 1
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: timescaledb
    depends_on:
      redpanda: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [contrail]

  pipeline:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    # The adaptive supervisor: sink workers plus the lag controller.
    #
    # Run under a shell, with trailing commands so the shell cannot exec-replace
    # itself with python. That keeps python a *child* rather than PID 1, which
    # matters for the Phase 2.5 chaos test: the kernel makes PID 1 in a namespace
    # immune to signals from inside it, and `docker kill` from outside is treated
    # as an operator stop so the restart policy is skipped. With python as a child,
    # killing it is a genuine application crash -- the shell exits non-zero and
    # the restart policy does what it exists to do.
    #
    # The trap forwards SIGTERM so workers finish their batch and commit; see the
    # windowing service for why it is written this way.
    stop_grace_period: 30s
    command:
      - sh
      - -c
      - |
        python -m src.control.supervisor --max-rate 250 --max-workers 4 & pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        wait $$pid; wait $$pid
        echo 'supervisor exited'; exit 1
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: timescaledb
    depends_on:
      redpanda: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
    networks: [contrail]

  generator:
    build: {context: ., target: base}
    # Restarted automatically, as any orchestrator would. Phase 2.5 kills
    # this process to prove recovery needs no manual intervention.
    restart: unless-stopped
    # SOURCE=opensky switches this to the live ADS-B feed with no code change.
    command: sh -c "python -m src.ingestor.run; echo 'generator exited'; exit 1"
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      SOURCE: ${SOURCE:-synthetic}
      GEN_AIRCRAFT: ${GEN_AIRCRAFT:-40}
      GEN_RATE_HZ: ${GEN_RATE_HZ:-2}
      CHAOS_OUT_OF_ORDER_PROB: ${CHAOS_OUT_OF_ORDER_PROB:-0.15}
      CHAOS_MAX_SKEW_S: ${CHAOS_MAX_SKEW_S:-20}
      CHAOS_DUPLICATE_PROB: ${CHAOS_DUPLICATE_PROB:-0.03}
      CHAOS_LATE_PROB: ${CHAOS_LATE_PROB:-0.01}
      CHAOS_DROP_PROB: ${CHAOS_DROP_PROB:-0.01}
    depends_on:
      redpanda: {condition: service_healthy}
    networks: [contrail]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${BIND_HOST:-127.0.0.1}:9090:9090"]
    networks: [contrail]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous read-only viewing is fine on loopback (the default bind) and not on a
      # network: set GRAFANA_ANONYMOUS=false together with any BIND_HOST other than 127.0.0.1.
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${BIND_HOST:-127.0.0.1}:3000:3000"]
    depends_on: [prometheus]
    networks: [contrail]

  # `docker compose run --rm tests` -- not started by `docker compose up`.
  tests:
    build:
      context: .
      target: dev
    profiles: [dev]
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./load:/app/load
    environment:
      KAFKA_BOOTSTRAP: redpanda:29092
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis:6379/0
    networks: [contrail]

volumes:
  timescale-data:

networks:
  contrail:
