global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Each pipeline process is its own target. Aggregating them behind one exporter
  # would make "which stage is behind" unanswerable, which is the main question
  # this dashboard exists to answer.
  - job_name: api
    static_configs: [{targets: ["api:8000"], labels: {component: api}}]
  - job_name: windowing
    static_configs: [{targets: ["windowing:9100"], labels: {component: windowing}}]
  - job_name: pipeline
    static_configs: [{targets: ["pipeline:9100"], labels: {component: pipeline}}]
